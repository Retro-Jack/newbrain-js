<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewBrain</title>
<style>
  /* The house DOS font, shared by copy from GenX-DOS. A genuine IBM VGA
     CP437 face, which is what the deck's little readout wants to be set in. */
  @font-face {
    font-family:'VGA437'; src:url(art/fonts/web437-vga.woff) format('woff');
    font-display:swap;
  }
  @font-face {
    font-family:'Segment16C';
    /* Segment16C by Daniel Wikholm, CC0 public domain. Subsetted here to
       printable ASCII plus U+2588, and converted from the CC0 TTF — the woff
       that shipped alongside it was a third-party conversion Chrome rejects
       outright ("Invalid font data"), despite a valid wOFF header. */
    src:url('art/fonts/Segment16C-Regular.woff2') format('woff2'),
        url('art/fonts/Segment16C-Regular.woff')  format('woff');
    font-display:block;
  }
  /* The GenX-DOS design language, from the landing page: the chrome round the
     machine is part of that product, so it uses those tokens rather than a
     palette of its own. --vfd stays separate — it is the colour of the real
     vacuum-fluorescent tube, not a UI choice. */
  :root {
    --vfd:#ffb347;
    --crt:#0B0D10; --panel:#14171C; --amber:#FFB000; --green:#35FF6D;
    --cyan:#4BC4D6; --paper:#D4D1C6; --dim:#837D6E;
    --line:rgba(255,176,0,.22);
    --ctl:118px; --top:40px;
  }
  html,body { margin:0; height:100%; background:var(--crt); }
  body { box-sizing:border-box; padding-top:var(--top); }
  /* The stage keeps the 1920x1080 artwork's proportions, so every region can
     be positioned in percentages taken straight off the measured artwork. */
  /* --ctl is the height the controls row needs below the artwork. The stage is
     capped to whatever is left, so a short or wide window shrinks the picture
     rather than pushing the controls off the bottom or under it. Without the
     cap, a 16:9 stage on a shallow window is taller than the viewport and the
     page scrolls, which is how the deck used to end up sitting on the
     machine. */
  
  #stage {
    position:relative; width:100%;
    max-width:min(1920px, calc((100vh - var(--ctl) - var(--top)) * 1920 / 1080));
    margin:0 auto;
    aspect-ratio:1920/1080;
    background:var(--crt);
  }
  /* The monitor and the machine are two independent parts, each absolutely
     placed on the stage and each carrying its own screen. A part's container
     IS its image box — the image is in flow at width:100%, so the box takes
     the image's aspect — which is what lets the screen regions be given as
     percentages of the part rather than of the page. Move or resize a part
     and its screen goes with it. */
  #monitor, #machine, #tapedeck { position:absolute; }
  #monitor img, #machine img, #tapedeck img { display:block; width:100%; height:auto; pointer-events:none; }

  /* The deck sits above the machine, same width and same left edge, in the
     space the monitor and the machine leave empty. Its reels turn while the
     tape runs, which is the whole reason it is here: it is the only part of
     the page that shows the machine doing something when nothing is being
     drawn on the screen.
     As with everything else here, only the reels move -- so the deck is one
     still image and the box holding both reels is a sprite sheet stepped by
     CSS. No hole is cut for it: unlike the little cassette this replaces,
     these reel hubs are opaque, and each sprite frame is a crop of the same
     photograph, so its border pixels already match what is underneath. */
  /* With nothing in the deck you see the bay itself -- spindles, heads,
     capstan, pinch roller. It is a second photograph of the same machine,
     laid over the first and revealed when the deck is empty, rather than a
     swap of the src: both are then in the document from the start, so the
     bay does not arrive a frame late the first time a tape is ejected.
     The reels go with it. They are part of the cassette, not the deck, so
     there is nothing for them to be drawn on. */
  #tapedeck img.bare { position:absolute; left:0; top:0; width:100%; opacity:0; }
  #tapedeck.empty img.bare { opacity:1; }
  #tapedeck.empty i { display:none; }

  #tapedeck i {
    position:absolute; display:block;
    background:url(art/deck-reels.webp) 0 0/100% 3700% no-repeat;
    animation:deckreels 3.6s steps(36) infinite;
    animation-play-state:paused;
    pointer-events:none; z-index:1;
  }
  #tapedeck.on i { animation-play-state:running; }

  /* The deck's own keys. Each is a hit area that carries the picture of that
     key pressed, shown by raising its opacity -- so one small image per key
     rather than a second copy of the whole deck, which is 9KB against 771KB.
     They have to be OPAQUE, and are flattened onto the stage colour when
     they are cut: a pressed key sits 15px lower, and the gap it leaves at
     the top has to HIDE the un-pressed key underneath. Transparency there
     would simply let it show through. */
  #tapedeck .key {
    position:absolute; z-index:3; cursor:pointer;
    background-size:100% 100%; background-repeat:no-repeat;
    opacity:0;
  }
  #tapedeck .key.down { opacity:1; }
  #tapedeck .key.off  { cursor:default; }
  #tapedeck .key[data-key=eject] { background-image:url(art/btn-eject.webp); }
  #tapedeck .key[data-key=next]  { background-image:url(art/btn-next.webp); }
  #tapedeck .key[data-key=rew]   { background-image:url(art/btn-rew.webp); }
  #tapedeck .key[data-key=play]  { background-image:url(art/btn-play.webp); }
  #tapedeck .key[data-key=ff]    { background-image:url(art/btn-ff.webp); }
  #tapedeck .key[data-key=rec]   { background-image:url(art/btn-rec.webp); }

  /* The readout in the deck's window: what is on the tape, and in what order.
     Sized in container units so the type scales with the deck rather than
     with the page -- the deck is a percentage of the stage, and the stage is
     a percentage of the viewport, so nothing else here is in pixels either. */
  #tapewin {
    position:absolute; z-index:2; container-type:size;
    display:grid; grid-template-rows:repeat(7, 1fr); grid-template-columns:100%;
    box-sizing:border-box;
    font-family:'VGA437',ui-monospace,monospace;
    color:var(--green); text-shadow:0 0 6px rgba(53,255,109,.45);
    line-height:1; overflow:hidden;
    pointer-events:none; white-space:pre;
  }
  /* A character grid: seven rows of twenty-one columns, which is what the
     readout is. The rows are grid tracks, so they are equal because the grid
     makes them so -- not because a line-height was tuned until they looked
     it. Each line is pinned to its own row below, so a line that is hidden
     leaves its row empty instead of pulling the ones under it up.

     The cell is the font's own: this face is 9x16 with ascent and descent
     coming to exactly 1em, so setting the type to a row's height makes the
     character grid and the glyph grid the same grid. The column width comes
     from `ch`, which tracks the advance the rasteriser actually uses -- 0.562
     of a row here, not the 0.5625 the font file designs for, because Chrome
     quantises advances. Measured, 21ch and 21 advances agree exactly, which
     is the only thing the grid depends on.

     100cqh/7 is that height. It goes on the CHILDREN, not on #tapewin: this
     element is the container those units resolve against, and a container
     query unit used on the container itself resolves against its ancestor
     instead, which would silently size the type off the wrong box.

     Twenty-one columns comes to 509.7 of the window's 546 deck px, leaving
     18 either side as the gutter -- and twenty-one is exactly the longest
     line the readout can show, "NN files on the tape," with a two-digit
     count. The rules and the progress bar are twenty-one wide too, so every
     full-width line ends on the same column. */
  /* Each line is a twenty-one column block, centred in the window, with the
     text centred inside it.

     What made the count line sit half a character left of the bar and the
     rules was not the centring: it was that the count ran the full
     twenty-one columns while they ran twenty. Any two lines of unequal
     parity centre half a cell apart. With all three the width of the grid
     they share an offset of zero, so they start on column 0 and end on
     column 21 whatever centres them.

     That leaves the short lines free to be centred properly. Rounding them
     to whole columns instead -- which an earlier pass did -- costs them half
     a cell of accuracy to buy an alignment they have nothing to align with,
     and "in that order." sat visibly left of the middle for it.

     white-space:pre is still wanted: it keeps the double spaces in
     "Type  LOAD ""  then press play." from collapsing. */
  /* grid-column:1 is not decoration. Two lines may be pinned to the same
     row -- "No tape." joins the progress bar on row four -- and an item with
     an explicit row but an automatic column does not stack, it is placed in
     the next free column. That silently made the grid two columns and twice
     the window wide, and every line sat flush against the left edge instead
     of centred. Named explicitly, they share the cell and overlap, which is
     what was wanted. */
  #tapewin > * { font-size:calc(100cqh / 7); width:21ch;
                 grid-column:1; justify-self:center;
                 text-align:center; position:relative; top:0.0692em; }
  /* That nudge centres the ink rather than the cells. Seven rows fill the
     window exactly, so the cell grid is flush to both edges -- but the ink
     inside the cells is not centred in them. Measured across the printable
     set, it runs from the very top of the cell (the quote marks reach it,
     and "Type  LOAD ""  then press play." puts them in row one) to 1.93px
     short of the bottom, where the descenders of g j p q y stop. So the
     readout sat hard against the top of the window with a gap under it,
     top-heavy by 0.138 of a row. Half of that, 0.0692em, splits the
     difference; it is in em so it tracks the type, and the descenders have
     the room to give back. */
  #twhint { grid-row:1; }  #twsep  { grid-row:2; }
  #twname { grid-row:3; }  #twbar  { grid-row:4; }
  #twrule { grid-row:5; }  #twcount{ grid-row:6; }
  #twnote { grid-row:7; }
  /* The tape's name is as long as its files are; it scrolls when it will not
     fit, and sits still when it will. The text is doubled so the loop closes
     on itself with no jump back. */
  #twname, #twhint { overflow:hidden; }
  /* vertical-align:top matters more than it looks. An inline-block sits on
     the baseline by default, so the line box grows by the strut's descent
     below it -- a quarter of an em in this face. These two rows cannot grow,
     being grid tracks, so instead their content would stand 1.25 rows tall
     inside a one-row cell: the name and the hint would sit off their grid
     line while every other row sat on it, and the overflow would be clipped.
     Aligning to the top drops the box out of baseline alignment, and the
     line box is then just the box: one row, like its neighbours. */
  #twname span, #twhint span { display:inline-block; vertical-align:top; }
  /* No timing function here on purpose: twFit sets it, because the number of
     steps is the number of characters in the text and only twFit knows that. */
  #twname.scroll span, #twhint.scroll span { animation:tapescroll infinite; }
  /* -50% is exactly one period -- the span holds (text+gap) twice -- so a
     steps() of the period's character count advances precisely one character
     per step. A real readout shifts its buffer a character at a time; it has
     no way to move half of one. */
  @keyframes tapescroll { to { transform:translateX(-50%); } }
  /* Drawn in actual hyphens, not a border: the readout is a character
     display, so its rules are made of characters like everything else in it.
     Twenty-one of them is the full width of the grid, which the progress bar
     and the count line also span, so all three end on the same column. No
     margin -- one cell tall like every other row. */
  #twrule, #twsep { opacity:.55; }
  #twrule::before, #twsep::before { content:'---------------------'; }
  /* The hint band earns its divider only when it has something to say;
     otherwise an empty line and a rule sit there looking like a fault. */
  #tapewin.nohint #twhint, #tapewin.nohint #twsep { display:none; }
  /* With no tape there is no name, no bar and no count, so the rule would be
     a line ruled across an empty readout. */
  #tapewin.notape #twrule { display:none; }
  /* With no tape there are two lines to place, and they sit either side of
     the middle row rather than on it: the name's row moves from three to
     three (it is already there) and the count comes up from six to five, so
     the pair spans rows three to five and centres on row four with a blank
     line between them. Rows four, six and seven are empty -- the bar, the
     count's own row and the note have nothing to say while the deck is
     empty. */
  #tapewin.notape #twname  { grid-row:3; }
  #tapewin.notape #twcount { grid-row:5; }
  @media (prefers-reduced-motion: reduce) {
    #twname.scroll span, #twhint.scroll span { animation:none; }
  }
  /* 37 rows for 36 frames: a percentage background-position travels
     (rows - 1) box heights, so the last row is a repeat of the first and
     never shows. Without it every step lands between frames. */
  @keyframes deckreels { to { background-position-y:100%; } }
  @media (prefers-reduced-motion: reduce) {
    #tapedeck.on i { animation:none; }
  }

  /* Within the monitor: black backing, then the picture, then the bezel over
     both. The backing fills the aperture's bounding box so its rounded
     corners read as screen rather than page background. */
  #screenbg { position:absolute; background:#000; z-index:0; }
  #crt      { position:absolute; background:transparent; z-index:1; }
  #monitor img { position:relative; z-index:2; }

  /* Within the machine: the VF text sits over the tube. */
  #machine img { position:relative; z-index:0; }
  #vfd { position:absolute; z-index:1; }

  /* Too narrow to stand side by side: stack them and let each take the width.
     Nothing about the screens needs saying again — they are placed within
     their own part, so they follow. */
  @media (max-width: 900px) {
    #stage { aspect-ratio:auto; height:auto; padding:16px 0; max-width:1920px; }
    #monitor, #machine, #tapedeck {
      position:relative;
      left:0 !important; top:0 !important; width:92% !important;
      margin:0 auto 20px;
    }
  }
  /* The status line and the cassette deck sit in the flow BELOW the stage,
     aligned to the artwork's own edges. They used to be position:fixed in the
     viewport's bottom corners, which overlapped the machine as soon as the
     window was short enough for the page to scroll. Nothing here overlays
     anything now, at any size. */
  #controls {
    width:100%; max-width:1920px; margin:0 auto;
    box-sizing:border-box; padding:10px 16px 16px;
    display:flex; align-items:flex-start; gap:16px;
    font:12px ui-monospace,monospace; color:var(--dim);
  }
  #meta { display:flex; flex-direction:column; gap:6px; min-width:0; }
  #hud { padding-top:4px; }
  #repo { color:var(--cyan); text-decoration:none; border-bottom:1px solid var(--line); }
  #repo:hover { color:#8fe3ef; border-bottom-color:currentColor; }

  #romerr {
    position:fixed; inset:0; margin:auto; z-index:20;
    width:min(30rem,calc(100% - 32px)); height:max-content;
    background:#26262c; border:1px solid #3a3a44; border-radius:6px;
    padding:20px 24px; color:#c9c9d2;
    font:13px/1.6 ui-monospace,monospace;
  }
  #romerr b { color:var(--vfd); font-size:15px; }
  #romerr p { margin:10px 0; color:#9a9aa6; }
  #romerr code { display:block; margin-top:12px; color:#7a7a85; font-size:11px; }
</style>
</head>
<body>
<div id="stage">
  <div id="tapedeck" class="empty" title="Cassette deck"><img src="art/deck.webp" alt=""><img class="bare" src="art/deck-empty.webp" alt=""><i></i>
    <span class="key" data-key="eject" title="Insert a tape, or eject the one in the deck"></span>
    <span class="key" data-key="next"  title="Add the next part of a multi-part tape"></span>
    <span class="key" data-key="rew"   title="Rewind"></span>
    <span class="key" data-key="play"  title="Play"></span>
    <span class="key" data-key="ff"    title="Fast forward"></span>
    <span class="key" data-key="rec"   title="Save what the machine has recorded"></span>
    <div id="tapewin" class="nohint notape" aria-hidden="true">
      <div id="twhint"><span></span></div>
      <div id="twsep"></div>
      <div id="twname"><span></span></div>
      <div id="twbar"></div>
      <div id="twrule"></div>
      <div id="twcount"></div>
      <div id="twnote"></div>
    </div>
  </div>
  <div id="monitor">
    <div id="screenbg"></div>
    <canvas id="crt" width="640" height="250"></canvas>
    <img src="art/cub.png" alt="">
  </div>
  <div id="machine">
    <img src="art/newbrain.png" alt="">
    <canvas id="vfd" width="320" height="30"></canvas>
  </div>
</div>
<div id="controls">
  <div id="meta">
    <div id="hud">Booting&hellip;</div>
    <a id="repo" href="https://github.com/Retro-Jack/newbrain-js">Source and ROM notes on GitHub</a>
  </div>
  <input id="tapefile" type="file" accept=".bas,.bin,.BAS,.BIN,.obj" multiple hidden>
</div>

<script type="module">
import { NewBrainSystem, CPU_HZ } from './src/system.js';
import { tapeBlocks } from './src/tape.js';
import { SCREEN_W, SCREEN_H } from './src/newbrain.js';

const hud = document.getElementById('hud');
const crtEl = document.getElementById('crt');
const crt = crtEl.getContext('2d', { alpha:true });

// The machine's frame is drawn at its native 640x250 on an offscreen canvas,
// then blitted to the visible one at whatever size the bezel's hole is.
//
// Doing that by hand rather than leaving it to CSS, because the picture is
// WIDER than its box on most windows (640 across a ~580px hole) and
// `image-rendering: pixelated` on a downscale drops whole columns — which ate
// parts of glyphs. Nearest-neighbour is only correct when magnifying.
const src = document.createElement('canvas');
src.width = SCREEN_W; src.height = SCREEN_H;
const sctx = src.getContext('2d', { alpha:false });
const img = sctx.createImageData(SCREEN_W, SCREEN_H);

function sizeCanvas() {
  const r = crtEl.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width  * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (crtEl.width !== w || crtEl.height !== h) { crtEl.width = w; crtEl.height = h; }
  // Smooth only where we are shrinking; keep it crisp where we are enlarging.
  crt.imageSmoothingEnabled = (w < SCREEN_W) || (h < SCREEN_H);
  crt.imageSmoothingQuality = 'high';
}
sizeCanvas();
addEventListener('resize', sizeCanvas);
new ResizeObserver(sizeCanvas).observe(crtEl);

// Place the CRT and VFD from the measured regions. The aperture has rounded
// corners, so the CRT is inset slightly inside its bounding box or the bezel
// clips the first and last columns.
// Regions come from art/regions.json, computed by art/compose.py following
// tools/bezel-test/README.md: the black backing fills the hole's bounding box
// so the rounded corners read as screen, and the picture goes in the largest
// rectangle INSCRIBED in the hole so the curve cannot clip the edge columns.
// No hand-tuned inset or bleed — both rectangles are measured.
const reg = await fetch('art/regions.json').then(r => r.json());
{
  // A part is placed by left/top/width only: its height comes from its own
  // image, so the box always matches the artwork whatever the width.
  const put = (el, r) => {
    el.style.left = r.left + '%'; el.style.top = r.top + '%';
    el.style.width = r.width + '%';
  };
  // A region inside a part is a percentage of that part, so it needs nothing
  // from the stage and survives the part being moved or resized.
  const within = (el, r) => {
    el.style.left = r.left + '%';  el.style.top    = r.top + '%';
    el.style.width = r.width + '%'; el.style.height = r.height + '%';
  };

  put(document.getElementById('monitor'), reg.cub.place);
  put(document.getElementById('machine'), reg.machine.place);
  put(document.getElementById('tapedeck'), reg.deck.place);

  within(document.getElementById('screenbg'), reg.cub.hole);
  within(document.getElementById('crt'),      reg.cub.crt);

  within(document.getElementById('vfd'), reg.machine.vfd);
  within(document.querySelector('#tapedeck i'), reg.deck.reels);
  within(document.getElementById('tapewin'), reg.deck.window);
  for (const [k, r] of Object.entries(reg.deck.buttons))
    within(document.querySelector(`#tapedeck .key[data-key="${k}"]`), r);
}

const names = ['aben191.ic6','cdi3.ic7','ef iss 1.ic8','char eprom iss 1.ic453','cop420-guw.ic419'];
let ab, cd, ef, chargen, copRaw;
try {
  [ab, cd, ef, chargen, copRaw] = await Promise.all(
    names.map(n => fetch('roms/' + encodeURIComponent(n))
      .then(r => { if (!r.ok) throw new Error(n + ': HTTP ' + r.status); return r.arrayBuffer(); })
      .then(b => new Uint8Array(b)))
  );
} catch (err) {
  // No ROMs is the ordinary case for anyone who has just cloned this, so say
  // so plainly rather than sitting on "booting..." for ever.
  hud.textContent = '';
  const panel = document.createElement('div');
  panel.id = 'romerr';
  panel.innerHTML =
    '<b>No ROMs</b>' +
    '<p>This emulator ships without them: the system ROMs are Grundy\u2019s and ' +
    'the keyboard controller\u2019s microcode is National Semiconductor\u2019s, ' +
    'and neither is ours to redistribute.</p>' +
    '<p>ROMS.txt lists the five files and where they go.</p>' +
    '<code>' + names.join('<br>') + '</code>';
  document.body.appendChild(panel);
  throw err;
}

// MAME marks this dump BAD and repairs two bytes before running it; the file
// on disk is never modified.
const cop = Uint8Array.from(copRaw);
cop[0x20a] = 0xc6;
cop[0x231] = 0xa6;

const sys = new NewBrainSystem({ ab, cd, ef, chargen, cop });
window.sys = sys;   // handy from the console

// Pace against the clock, not the display: rAF fires at the monitor's refresh
// rate, which on a 180Hz panel ran the machine 3.6x too fast.
const FRAME_MS = 1000 / 50;
let acc = 0, prev = performance.now();
// ---- VFD ------------------------------------------------------------------
// 16 characters, drawn over the tube in the artwork. The panel is a 14-segment
// starburst, so Jack's Segment16C renders it far more honestly than a normal
// font would; unlit segments are drawn faintly underneath, as the real tube
// shows them.
const vfdEl  = document.getElementById('vfd');
const vfdCtx = vfdEl.getContext('2d');

// The panel is drawn, not blitted from a fixed bitmap, so it should be drawn
// at the size it is actually shown — glyphs then come out crisp whatever the
// window is doing. Sizing the backing store off the nominal 1920 stage left
// it 282px wide inside a 220px box: a 0.78x downscale, which with
// `image-rendering: pixelated` drops whole columns and eats parts of strokes.
// Same trap as the CRT, where it cost parts of glyphs before.
function sizeVfd() {
  const r = vfdEl.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (vfdEl.width !== w || vfdEl.height !== h) {
    vfdEl.width = w; vfdEl.height = h;
    vfdPrev = null;          // resizing clears the canvas, so force a redraw
  }
}
// Brightness is a single gain so it can be tuned in one place. Scaling the
// channels alone would clamp green (already 255) and drag the hue toward cyan,
// so the gain is split: part into the channels, the rest into a bloom, which
// is also closer to how a real tube reads.
// Brightness as a single gain, tunable in one place.
//
// A literal x1.25 of luminance is not available: the base green is already at
// 255, and rgb(110,255,200) is luminance ~220 against a 255 ceiling, so pure
// white is only +16%. Scaling the channels therefore does nothing useful — it
// clamps green and skews the hue. Instead the gain is spent on the two things
// that do read as brighter on an emissive display: lifting the colour toward
// white, and blooming the glyph.
const VFD_GAIN = 1.25;
// Sampled from a photograph of a real lit NewBrain tube (brightest 2% of the
// lit segments, normalised to full green): the phosphor is a warmer, yellower
// green than the cyan-green guess it replaces. Measured contrast against the
// unlit tube was 14x, which is why the unlit segments stay very faint.
const VFD_BASE = [178, 255, 202];
const t = Math.min(1, VFD_GAIN - 1);                       // lift toward white
const lit = VFD_BASE.map(v => Math.round(v + (255 - v) * t));
const VFD_LIT   = `rgb(${lit.join(',')})`;
const VFD_UNLIT = `rgba(${VFD_BASE.join(',')},${(0.085 * VFD_GAIN).toFixed(4)})`;
const VFD_GLOW  = (VFD_GAIN - 1) * 18;   // px of bloom, the rest of the gain
let vfdPrev = null, vfdReady = false;

document.fonts.load('16px Segment16C').then(() => { vfdReady = true; vfdPrev = null; });

// Only once vfdPrev exists: sizeVfd clears it to force a redraw, and both it
// and vfdEl are declared above this point.
sizeVfd();
addEventListener('resize', sizeVfd);
new ResizeObserver(sizeVfd).observe(vfdEl);

function drawVfd() {
  if (!vfdReady) return;
  const text = sys.machine.vfdText();
  if (text === vfdPrev) return;
  vfdPrev = text;

  const W = vfdEl.width, H = vfdEl.height, N = 16, cw = W / N;
  vfdCtx.clearRect(0, 0, W, H);
  vfdCtx.textAlign = 'center';
  vfdCtx.textBaseline = 'middle';
  vfdCtx.font = Math.round(H * 0.92) + 'px Segment16C';

  for (let i = 0; i < N; i++) {
    const x = cw * (i + 0.5), y = H / 2;
    // every segment, faint - what an unlit cell actually looks like
    vfdCtx.fillStyle = VFD_UNLIT;
    vfdCtx.fillText('\u2588', x, y);
    const ch = text[i];
    if (ch && ch !== ' ') {
      vfdCtx.fillStyle = VFD_LIT;
      vfdCtx.shadowColor = VFD_LIT;
      vfdCtx.shadowBlur = VFD_GLOW;
      vfdCtx.fillText(ch, x, y);
      vfdCtx.shadowBlur = 0;
    }
  }
}

// ---- keyboard --------------------------------------------------------------
// The matrix is 16 rows of 4 bits, scanned by the COP420. Mapped by physical
// key (event.code) so the layout does not depend on the host's keymap.
const KEYMAP = {
  KeyA:[13,0], KeyB:[7,3],  KeyC:[9,3],  KeyD:[11,0], KeyE:[11,2], KeyF:[10,0],
  KeyG:[9,0],  KeyH:[8,0],  KeyI:[3,0],  KeyJ:[2,3],  KeyK:[13,3], KeyL:[6,0],
  KeyM:[4,3],  KeyN:[3,3],  KeyO:[5,0],  KeyP:[9,1],  KeyQ:[13,2], KeyR:[10,2],
  KeyS:[12,0], KeyT:[9,2],  KeyU:[2,0],  KeyV:[8,3],  KeyW:[12,2], KeyX:[10,3],
  KeyY:[4,0],  KeyZ:[11,3],
  Digit1:[8,2], Digit2:[7,2], Digit3:[6,2], Digit4:[5,2], Digit5:[4,2],
  Digit6:[3,2], Digit7:[2,2], Digit8:[2,1], Digit9:[3,1], Digit0:[4,1],
  Space:[14,2], Enter:[13,1], NumpadEnter:[13,1],
  ShiftLeft:[15,0], ShiftRight:[15,0], ControlLeft:[15,3], ControlRight:[15,3],
  Escape:[0,1], Home:[14,3], Insert:[12,3],
  ArrowUp:[1,3], ArrowDown:[1,0], ArrowLeft:[1,2], ArrowRight:[1,1],
  Comma:[5,3], Period:[6,3], Slash:[14,0], Semicolon:[7,0],
  Minus:[11,1], Equal:[10,1], BracketLeft:[5,1], BracketRight:[6,1],
  Quote:[12,1], Backquote:[8,1], Tab:[15,1], Backspace:[1,2],
};

addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  sys.machine.setKey(k[0], k[1], true);
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  sys.machine.setKey(k[0], k[1], false);
});
// A tab switch can leave keys stuck down.
addEventListener('blur', () => sys.machine.clearKeys());

// ---- cassette --------------------------------------------------------------
// Nothing here touches the COP. The file is turned into a signal and played
// into TPIN, and the machine's own microcode reads it, so the sequence is the
// one a real deck needs: tell BASIC to listen, then press play.
//
// Playback is gated on the motor, which the ROM stops between blocks while it
// stows one away. That is what lets long programs load, and it also means the
// tape genuinely waits rather than running on past the machine.
const deck = {
  // A cassette holds programs one after another, and a multi-part title is
  // exactly that: Chess is a BASIC loader followed by a 16K binary, and the
  // loader asks for the binary once it is running. So the tape is a LIST of
  // files, concatenated. Each is already a chain of blocks whose type byte
  // flags its own first and last, so the join needs nothing in between — the
  // ROM reads the loader, stops at its last block, and finds the binary's
  // leader where it left off when the program calls for it.
  parts: [],
  bytes: null,
  name: '',
  fileEl:  document.getElementById('tapefile'),
  deckEl:  document.getElementById('tapedeck'),
  // The reels turn only once the transport has been engaged from the panel.
  // The motor line alone will not do: typing LOAD "" raises it and holds it
  // high while the machine sits waiting for a signal, with nothing in the
  // deck and nothing moving, so the reels would spin at a stopped tape.
  engaged: false,
};

const TW_GAP = '\u00a0\u00a0\u00a0\u00b7\u00a0\u00a0\u00a0';

// A line of the readout, scrolled only when it will not fit.
//
// The separator goes on the end of BOTH copies, not between them. Written as
// text+gap+text the span is 2*text+gap wide, so translating -50% moves
// text+gap/2 -- half a separator short of one period, and it jumps by that
// much every time round. Written as (text+gap)+(text+gap) the halves are
// identical, -50% is exactly one period, and the loop closes.
function twFit(box, text) {
  const span = box.firstElementChild;
  span.textContent = text;
  box.classList.remove('scroll');
  span.style.animationDuration = '';
  span.style.animationTimingFunction = '';
  if (!text) return;
  requestAnimationFrame(() => {
    if (span.scrollWidth - box.clientWidth <= 1) return;
    const period = text + TW_GAP;
    span.textContent = period.repeat(2);
    box.classList.add('scroll');
    // A steady reading pace whatever the length: one pass takes as long as
    // the text is wide.
    span.style.animationDuration = (span.scrollWidth / 2 / 26).toFixed(1) + 's';
    // Stepped, not smooth. The travel is one period, so one step per
    // character in it moves the line a whole cell at a time, which is the
    // only way a character display can move anything.
    span.style.animationTimingFunction = `steps(${period.length})`;
  });
}

function deckHint(text) {
  // The deck's own readout is the only place this goes now. The text is often
  // longer than the twenty characters the window holds, so it scrolls exactly
  // as the tape's name does.
  twFit(document.getElementById('twhint'), text || '');
  document.getElementById('tapewin').classList.toggle('nohint', !text);
}

// The bar fills a slab at a time: a fraction is floored to whole slabs, and 1
// lights every one. The count comes from the stylesheet, so --slabs is the one
// place it is written down.
// What each key is allowed to do, given what is in the deck. This used to be
// the panel's `disabled` flags; with the panel gone it is written down here.
const can = { eject:true, next:false, rew:false, play:false, rec:false };
function deckState() {
  const loaded  = !!deck.bytes;
  const playing = !!sys.machine.tape;
  can.eject = true;                     // insert when empty, eject when not
  can.next  = loaded;                   // parts after the first
  can.play  = loaded && !playing;
  can.rew   = playing;
  can.rec   = sys.machine.hasRecording;
  deckKeys();
  tapeWindow();
}

// ---- the deck's own keys --------------------------------------------------
// They drive the panel's controls rather than repeating them, so what is
// allowed when, and what the hint says, stay written down in one place. A key
// whose control is disabled does nothing and stops looking clickable.
const KEYS = {};
for (const el of document.querySelectorAll('#tapedeck .key')) KEYS[el.dataset.key] = el;

const keyAction = {
  // Eject does double duty, which is what the two symbols moulded on it say:
  // with nothing in the deck it opens the file picker, and with a tape in it
  // ejects that tape and every part of it.
  eject: () => (deck.parts.length ? doEject() : deck.fileEl.click()),
  // Parts after the first go on with NEXT.
  next:  () => deck.fileEl.click(),
  rew:   doRewind,
  play:  doPlay,
  ff:    null,                            // nothing wired to it yet
  rec:   doSave,
};

function deckKeys() {
  for (const [name, el] of Object.entries(KEYS))
    el.classList.toggle('off', !can[name]);
}

for (const [name, el] of Object.entries(KEYS)) {
  el.addEventListener('click', () => {
    if (!can[name] || !keyAction[name]) return;
    // Play stays down for as long as the tape runs, so it is left to the
    // frame loop; the rest are momentary and flash.
    if (name !== 'play') {
      el.classList.add('down');
      setTimeout(() => el.classList.remove('down'), 170);
    }
    keyAction[name]();
    deckState();
  });
}

// The deck's own window: what is on the tape, and in what order. It says the
// same as the panel below the stage, but it says it on the machine, which is
// where you are looking while a tape loads.
const twName  = document.getElementById('twname');
const twBar   = document.getElementById('twbar');
const twCount = document.getElementById('twcount');
const twNote  = document.getElementById('twnote');
// Nineteen cells plus its two brackets is twenty-one characters, the full
// width of the grid -- the same span as the rules above and below it.
const TW_CELLS = 19;

// Is BASIC sitting at its prompt, waiting to be told something?
//
// This started out as a guess from the transport -- motor stopped for longer
// than a block gap -- and the guess was wrong often enough to matter: the
// gaps between blocks measured 0.18s, 2.70s and 3.72s loading Pacman, and a
// 3s threshold duly fired in the middle of the 3.72s one and told the user
// to type something while the tape was still running.
//
// The machine will just say, though. The display is characters in RAM, 40 to
// a row on a 64-byte stride from `tvl`, in plain ASCII, and the cursor is
// 0x7F. Measured across a whole Pacman load: 0x7F never appears while the
// tape is reading, never appears during either block gap, and blinks
// steadily through the 13s the machine spent at the prompt. That is the
// signal, and unlike a timer it cannot be wrong about a slow block.
//
// Blinking is why it is remembered rather than tested outright: it is dark
// for about 280ms at a time, so a single look lands in the gap often enough.
const TW_CURSOR = 0x7f;
const TW_BLINK = 800;          // comfortably longer than the dark phase
const TW_ROWS = 24, TW_COLS = 40, TW_STRIDE = 64;

function cursorShowing() {
  const ram = sys.machine.ram;
  const base = sys.machine.tvl;
  const stride = sys.machine.c80l ? TW_STRIDE * 2 : TW_STRIDE;
  const cols = sys.machine.c80l ? TW_COLS * 2 : TW_COLS;
  for (let r = 0; r < TW_ROWS; r++) {
    const a = base + r * stride;
    for (let c = 0; c < cols; c++) {
      if (ram[(a + c) & 0x7fff] === TW_CURSOR) return true;
    }
  }
  return false;
}
function twProgress(frac) {
  if (frac === null) { twBar.textContent = ''; return; }
  const lit = Math.max(0, Math.min(TW_CELLS, Math.round(frac * TW_CELLS)));
  twBar.textContent = '[' + '#'.repeat(lit) + '='.repeat(TW_CELLS - lit) + ']';
}

function tapeWindow() {
  const n = deck.parts.length;
  document.getElementById('tapewin').classList.toggle('notape', !n);
  deck.deckEl.classList.toggle('empty', !n);
  // Not just the state but the remedy: the eject button is how a tape gets
  // in, and that is only discoverable from a tooltip, which is a hover away
  // and no use at all on a phone. It is said across two lines, the second
  // of which borrows the count's row -- "Press eject to insert" is exactly
  // twenty-one characters, so it fills the grid without scrolling.
  const name = n ? deck.name : 'No tape';
  // A tape in the deck shows an empty trough; an empty deck shows nothing.
  twProgress(n ? (sys.machine.tape ? sys.machine.tape.progress : 0) : null);
  // One sentence across two rows, so the count line takes the comma and the
  // note finishes it. With a single file there is no note to finish it, so
  // the comma would be left dangling -- that line ends in a stop instead.
  twCount.textContent = n ? `${n} file${n === 1 ? '' : 's'} on the tape${n > 1 ? ',' : '.'}`
                          : 'Press eject to insert';
  // Order only means something when there is more than one.
  twNote.textContent  = n > 1 ? 'in that order.' : '';

  twFit(twName, name);
}

// Called once everything the readout needs exists: deckState() reaches
// tapeWindow(), which uses the consts declared just above.
deckState();

// Lays the parts end to end to make the tape.
function deckRebuild() {
  const total = deck.parts.reduce((n, p) => n + p.bytes.length, 0);
  if (!total) { deck.bytes = null; deck.name = ''; return; }
  const tape = new Uint8Array(total);
  let at = 0;
  for (const p of deck.parts) { tape.set(p.bytes, at); at += p.bytes.length; }
  deck.bytes = tape;
  deck.name = deck.parts.map(p => p.name).join(' + ');
}

deck.fileEl.addEventListener('change', async () => {
  const picked = [...deck.fileEl.files];
  if (!picked.length) return;
  const first = !deck.parts.length;
  for (const file of picked) {
    deck.parts.push({ name: file.name, bytes: new Uint8Array(await file.arrayBuffer()) });
  }
  deckRebuild();
  sys.machine.ejectTape();
  twProgress(0);
  deckState();
  // A file that is not in tape format contributes no blocks, and encodeTape
  // simply has nothing to lay down for it — so it would go on the tape
  // silently and not be there. Adv's ADV.BIN is one: a raw 28K memory image,
  // not a recording. Say so rather than let it look loaded.
  const notTapes = deck.parts.filter(p => !tapeBlocks(p.bytes).length);
  if (notTapes.length) {
    deckHint(`${notTapes[0].name} is not a tape file.`);
  } else {
    deckHint(first
      ? 'Type  LOAD ""  then press play.'
      : `${deck.parts.length} programs on the tape, in that order.`);
  }
  deck.fileEl.value = '';          // so the same file can be added again
  deck.fileEl.blur();
});

function doPlay() {
  deck.engaged = true; deck.waiting = undefined;
  deck.stoppedAt = undefined; deck.promptShown = false;
  sys.machine.loadTape(deck.bytes); deckHint('Playing.');
}
function doRewind() {
  deck.engaged = true; deck.waiting = undefined;
  deck.stoppedAt = undefined; deck.promptShown = false;
  sys.machine.loadTape(deck.bytes);
  deckHint('Rewound; playing from the start.');
}
function doEject() {
  deck.engaged = false;
  sys.machine.ejectTape();
  deck.parts = []; deck.bytes = null; deck.name = ''; deck.fileEl.value = '';
  twProgress(null);
  deckHint('');
}

// Hands back whatever the machine has written to tape. The bytes are read off
// the tape line and demodulated, so the file is the same shape as one off a
// real cassette — the COP's own 00 in front of each block included — and it
// loads straight back in.
function doSave() {
  const bytes = sys.machine.recordedTape();
  if (!bytes.length) { deckHint('Nothing recorded.'); return; }
  deck.engaged = true;

  // Name the file after the tape's own name block, if it has one.
  let name = 'newbrain';
  if (bytes[0] === 0 && bytes.length > 3) {
    const count = bytes[1] | (bytes[2] << 8);
    if (bytes[3 + count] === 0x81 && count > 0 && count < 32) {
      const n = String.fromCharCode(...bytes.slice(3, 3 + count))
        .replace(/[^A-Za-z0-9 ._-]/g, '').trim();
      if (n) name = n;
    }
  }

  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  const a = document.createElement('a');
  a.href = url; a.download = name + '.bas';
  a.click();
  URL.revokeObjectURL(url);
  deckHint(`Saved ${name}.bas, ${bytes.length} bytes.`);
}

function drawDeck() {
  const tape = sys.machine.tape;
  // The reels follow the motor, but only after play or save has been
  // pressed — before that the deck is stopped however the motor line reads.
  deck.deckEl.classList.toggle('on', deck.engaged && sys.machine.motor);
  // Play is held down while the tape is running, as it would be on the deck.
  KEYS.play.classList.toggle('down', deck.engaged && !!tape && !tape.played);
  if (can.rec !== sys.machine.hasRecording) deckState();
  if (!tape) return;
  twProgress(tape.progress);

  // A load is not one continuous run of tape. The ROM stops the motor between
  // blocks while it digests what it just read, and on a long program that
  // pause is easily long enough to look like something has gone wrong. Saying
  // so is the whole point of the line.
  //
  // Only transitions are announced, and the first reading is adopted in
  // silence, so this cannot talk over the hint whoever pressed the button
  // just set -- "Rewound; playing from the start." survives until the motor
  // actually changes state.
  if (deck.engaged && !tape.played) {
    const waiting = !sys.machine.motor;
    if (deck.waiting === undefined) {
      deck.waiting = waiting;
    } else if (waiting !== deck.waiting) {
      deck.waiting = waiting;
      deckHint(waiting ? 'Please wait.' : 'Playing.');
    }

    // Stopped for a good while with tape still to come, on a tape that has
    // more than one file on it: the machine has finished a file and gone
    // back to the prompt, and it will sit there until it is told what to do
    // next. Nobody is coming to tell them that, so the readout does.
    //
    // It does not say which command, because the deck cannot know. A plain
    // multi-file tape wants LOAD "" again; a tape fronted by a loader, which
    // is most of them, wants RUN and then fetches the rest itself. Pacman is
    // the second kind, and an earlier version of this line confidently told
    // the user to type the wrong one.
    //
    // The prompt is read off the screen, not inferred from how long the tape
    // has been still -- see cursorShowing() for why the timer was not good
    // enough.
    //
    // This infers the prompt from the transport rather than seeing it. The
    // machine has no text buffer to read -- the screen goes from video RAM
    // straight to pixels, in rows that are terminated rather than fixed
    // width -- so there is nothing to check for a cursor without
    // reimplementing the display. The threshold is what separates the two
    // kinds of stillness: a measured load of tycoon.bas pauses 1.7s between
    // blocks, so TW_SETTLE sits well clear of that. A single-file tape
    // cannot reach here, because `played` goes true and the hint clears.
    if (waiting && deck.parts.length > 1) {
      if (cursorShowing()) deck.cursorAt = performance.now();
      const atPrompt = deck.cursorAt !== undefined &&
                       performance.now() - deck.cursorAt < TW_BLINK;
      if (atPrompt && !deck.promptShown) {
        deck.promptShown = true;
        deckHint('Waiting. Type  RUN  or  LOAD ""  for the next part.');
      }
    } else {
      deck.cursorAt = undefined;
      deck.promptShown = false;
    }
  }
  // `played`, not `finished`: the ROM stops the motor on the last block and
  // never runs out the gap tone behind it, so the signal never ends on its own.
  // Once the data has gone past there is nothing left to say, so the status
  // clears rather than sitting on "playing" for good.
  if (tape.played && !deck.doneShown) {
    deck.doneShown = true;
    deckHint('');
    deckState();
  } else if (!tape.played) {
    deck.doneShown = false;
  }
}

let frames = 0, last = performance.now();
function frame() {
  const now = performance.now();
  acc += Math.min(now - prev, 200);   // cap so a background tab can't sprint
  prev = now;
  let ran = 0;
  while (acc >= FRAME_MS && ran < 4) { sys.runFrame(); acc -= FRAME_MS; ran++; }

  // Only draw when the machine has actually moved on. requestAnimationFrame
  // fires at the monitor's rate, which on a 180Hz panel is 3.6 redraws of a
  // picture that cannot have changed; the machine produces 50 frames a second
  // and there is nothing to show between them.
  if (ran) {
    drawVfd();
    drawDeck();
    sys.machine.renderInto(img.data);
    sctx.putImageData(img, 0, 0);
    crt.clearRect(0, 0, crtEl.width, crtEl.height);
    crt.drawImage(src, 0, 0, SCREEN_W, SCREEN_H, 0, 0, crtEl.width, crtEl.height);

    if (++frames % 25 === 0) {
      const t = performance.now(); const fps = 25000 / (t - last); last = t;
      const m = sys.machine;
      hud.textContent = `t=${sys.seconds.toFixed(1)}s  ${fps.toFixed(0)}fps  ` +
        `pwrup=${m.pwrup} tvp=${m.tvp} ${m.c80l ? 80 : 40}col  PC=0x${sys.pc.toString(16).toUpperCase()}`;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
